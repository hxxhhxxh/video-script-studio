<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频链接 → 改写剧本 · 人物画像 · 分镜提示词</title>
<style>
:root{
  --bg:#f6f4ef;--card:#fff;--ink:#1d1b18;--ink2:#4a463f;--ink3:#857f74;
  --line:#e3ded3;--brand:#a8341f;--gold:#b4893a;--ok:#2f7d55;--bad:#a8341f;--warn:#b26a12;
  --r:14px;--sh:0 1px 2px rgba(29,27,24,.06),0 8px 24px rgba(29,27,24,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header{background:linear-gradient(160deg,#2a1d17,#4a2a1c 60%,#5d3320);color:#f7f1e6;padding:22px 0 18px;border-bottom:3px solid var(--gold)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1{margin:0;font-size:23px;letter-spacing:.5px}
h1 small{display:block;font-size:11.5px;font-weight:400;color:#e7c99a;letter-spacing:2px;margin-top:4px}
.chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:#e9d9be}
.chip{border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:2px 10px}
.chip.ok{border-color:#8fd0a9;color:#c9f0d8}.chip.bad{border-color:#e5a99c;color:#ffd9d0}
main{max-width:1180px;margin:0 auto;padding:22px 20px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--sh);margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h2 em{font-style:normal;font-size:11px;background:var(--brand);color:#fff;padding:2px 8px;border-radius:99px}
label{display:block;font-size:12.5px;color:var(--ink3);margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:14px/1.6 inherit;background:#fdfcf9;color:var(--ink)}
textarea{resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:13px}
input:focus,select:focus,textarea:focus{outline:2px solid #e7d3a8;border-color:var(--gold)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr}}
button{cursor:pointer;font:inherit;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink2);padding:8px 14px}
button:hover{border-color:var(--brand);color:var(--brand)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
button.primary:disabled{opacity:.55;cursor:default}
button.mini{padding:5px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.log{background:#241c17;color:#e7dccb;border-radius:10px;padding:12px 14px;font:12.5px/1.75 ui-monospace,Consolas,monospace;max-height:280px;overflow:auto;white-space:pre-wrap}
.log .t{color:#b4893a;margin-right:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border-radius:99px}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.kv{font-size:13.5px}
.kv div{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv div:last-child{border:0}
.kv span:first-child{color:var(--ink3);flex:none;min-width:76px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#faf8f3;color:var(--ink3);font-size:12.5px;position:sticky;top:0}
tr:hover{background:#fcfaf5}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);background:#faf8f3;color:var(--ink3)}
.mono{font:12.5px/1.7 ui-monospace,Consolas,monospace;background:#f7f4ec;border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-word}
.char{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.char{grid-template-columns:1fr}}
.char .box{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fdfcf9}
.char h3{margin:0 0 6px;font-size:15px}
.badge{font-size:11.5px;background:#f2ede2;border-radius:99px;padding:2px 9px;color:var(--ink3);margin-left:6px}
.scroll{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.hint{font-size:12.5px;color:var(--ink3);margin:6px 0 0}
details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fdfcf9;margin-top:10px}
summary{cursor:pointer;font-size:13.5px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);opacity:0;background:#2a1d17;color:#fff;padding:9px 18px;border-radius:99px;font-size:13px;transition:.25s;pointer-events:none;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>视频链接 → 改写剧本 · 人物画像 · 分镜提示词<small>LINK · TRANSCRIBE · REWRITE · STORYBOARD</small></h1>
  <div class="chips" id="health"><span class="chip">检查环境中…</span></div>
</div></header>

<main>
  <div class="card">
    <h2>① 丢一个视频链接进来<em>从这里开始</em></h2>
    <label>视频链接（支持抖音 / B站 / 小红书 / YouTube 等 yt-dlp 能识别的站点）</label>
    <input id="url" placeholder="https://www.douyin.com/video/xxxxxxxxxxx" autocomplete="off">
    <div class="grid g3" style="margin-top:6px">
      <div><label>成片目标时长</label>
        <select id="target"><option value="30">30 秒</option><option value="60" selected>60 秒</option>
        <option value="90">90 秒</option><option value="120">120 秒</option><option value="180">180 秒</option></select></div>
      <div><label>画面比例</label>
        <select id="aspect"><option>9:16 竖屏</option><option>16:9 横屏</option><option>1:1 方形</option><option>4:3</option></select></div>
      <div><label>语音识别模型</label>
        <select id="whisper"><option value="small" selected>small（约 500MB，推荐）</option>
        <option value="base">base（约 150MB，快）</option><option value="medium">medium（约 1.5GB，准但慢）</option>
        <option value="large-v3">large-v3（约 3GB，最准，很慢）</option></select></div>
    </div>
    <div class="grid g2" style="margin-top:6px">
      <div><label>风格参考（可留空，让模型自己定）</label>
        <input id="style" placeholder="例：清乾隆年间运河水乡，暖调胶片质感，浅景深"></div>
      <div><label>额外要求（可留空）</label>
        <input id="notes" placeholder="例：主角必须是中年男性，不要出现现代物件"></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="go">开始分析</button>
      <button id="fillDemo">填入示例链接</button>
      <span class="hint" id="tip">第一次跑语音识别会下载模型，约 1 分钟；本地大模型出字约 13 字/秒，一条 60 秒视频大概 3–15 分钟。</span>
    </div>
    <details style="margin-top:12px" id="cfgBox">
      <summary>后端设置（本机运行可不管；前端放公网时才需要填）</summary>
      <div class="grid g2" style="margin-top:10px">
        <div><label>后端地址</label><input id="backend" placeholder="https://你的后端域名（留空 = 当前站点）"></div>
        <div><label>访问口令</label><input id="token" type="password" placeholder="填后端 .access-token.txt 里的口令"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="mini primary" onclick="saveCfg()">保存设置</button>
        <button class="mini" onclick="clearCfg()">清除</button>
        <span class="hint" id="cfgState"></span>
      </div>
    </details>
  </div>

  <div class="card" id="progCard" style="display:none">
    <h2>② 进度<em id="statusTag">排队中</em></h2>
    <div class="log" id="log"></div>
    <div class="row" style="margin-top:10px">
      <button class="mini" onclick="download('md')">下载 Markdown</button>
      <button class="mini" onclick="download('csv')">下载分镜 CSV</button>
      <button class="mini" onclick="download('json')">下载原始 JSON</button>
    </div>
  </div>

  <div id="out" style="display:none">
    <div class="tabs" id="tabs"></div>
    <div id="pane"></div>
  </div>

  <div class="card">
    <h2>提示词配方<em>可复制去改</em></h2>
    <p class="hint">系统实际发给大模型的指令原文。想改产出风格，改 <code>prompts.py</code> 里的中文描述即可。</p>
    <div id="recipes"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
let JOB = null, RESULT = null, TIMER = null, TAB = 'script';

/* ── 后端地址与口令：支持“前端放公网、后端在本机” ── */
function cfgGet(k, d) { try { return localStorage.getItem('vss_' + k) || d; } catch (e) { return d; } }
function cfgSet(k, v) { try { localStorage.setItem('vss_' + k, v); } catch (e) {} }
let BACKEND = cfgGet('backend', '');
let TOKEN = cfgGet('token', '');

function apiUrl(p, withQueryToken) {
  const base = BACKEND ? BACKEND.replace(/\/+$/, '') : '';
  if (withQueryToken && TOKEN) return base + p + (p.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);
  return base + p;
}
function authHeaders(extra) {
  const h = Object.assign({}, extra || {});
  if (TOKEN) h['x-auth-token'] = TOKEN;
  return h;
}
async function jget(p) {
  const r = await fetch(apiUrl(p), { headers: authHeaders() });
  if (!r.ok) throw new Error('HTTP ' + r.status + (r.status === 401 ? '（口令不对或没填）' : ''));
  return r.json();
}

function saveCfg() {
  BACKEND = $('#backend').value.trim(); TOKEN = $('#token').value.trim();
  cfgSet('backend', BACKEND); cfgSet('token', TOKEN);
  $('#cfgState').textContent = BACKEND ? ('已指向 ' + BACKEND) : '使用当前站点';
  toast('设置已保存'); health();
}
function clearCfg() {
  BACKEND = ''; TOKEN = ''; cfgSet('backend', ''); cfgSet('token', '');
  $('#backend').value = ''; $('#token').value = ''; $('#cfgState').textContent = ''; toast('已清除'); health();
}
function initCfg() {
  const q = new URLSearchParams(location.search);
  if (q.get('backend')) { BACKEND = q.get('backend'); cfgSet('backend', BACKEND); }
  if (q.get('token')) { TOKEN = q.get('token'); cfgSet('token', TOKEN); }
  $('#backend').value = BACKEND; $('#token').value = TOKEN;
  $('#cfgState').textContent = BACKEND ? ('已指向 ' + BACKEND) : '使用当前站点';
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1600);}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function copy(text,label){navigator.clipboard.writeText(text).then(()=>toast(label||'已复制'),()=>toast('复制失败'));}

async function health(){
  try{
    const r = await jget('/api/health');
    $('#health').innerHTML = r.items.map(i=>`<span class="chip ${i.ok?'ok':'bad'}">${esc(i.name)}：${esc(i.detail)}</span>`).join('')
      + `<span class="chip">推理方式：${r.llm_mode==='cloud'?'云端接口':'本地 Ollama'}</span>`;
  }catch(e){ $('#health').innerHTML = '<span class="chip bad">后端连不上：' + esc(e.message) + '</span>'; }
}
async function recipes(){
  try{
    const r = await jget('/api/prompts');
    $('#recipes').innerHTML = Object.entries(r).map(([k,v])=>
      `<details><summary>${esc(k)}</summary><div class="row" style="margin:8px 0"><button class="mini" onclick="copyRecipes(this)">复制这一组</button></div>
       <div class="mono">${esc(v)}</div></details>`).join('');
  }catch(e){}
}
function copyRecipes(btn){const t=btn.closest('details').querySelector('.mono');copy(t.textContent,'提示词已复制');}

$('#go').onclick = async () => {
  const url = $('#url').value.trim();
  if(!url){toast('先填链接');return;}
  $('#go').disabled = true; $('#progCard').style.display=''; $('#out').style.display='none';
  $('#log').innerHTML=''; RESULT=null;
  const body = {url, target_seconds:+$('#target').value, aspect:$('#aspect').value,
                style:$('#style').value, notes:$('#notes').value, whisper:$('#whisper').value};
  let r;
  try{
    r = await (await fetch(apiUrl('/api/analyze'), {method:'POST',
        headers: authHeaders({'Content-Type':'application/json'}), body: JSON.stringify(body)})).json();
  }catch(e){ toast('提交失败：' + e.message); $('#go').disabled=false; return; }
  if(!r.job_id){toast('提交失败');$('#go').disabled=false;return;};
  JOB = r.job_id; poll();
};
function poll(){
  clearInterval(TIMER);
  TIMER = setInterval(async () => {
    let j;
    try { j = await jget('/api/jobs/'+JOB); }
    catch(e) { clearInterval(TIMER); $('#go').disabled=false; $('#statusTag').textContent='后端连不上：'+e.message; return; }
    $('#log').innerHTML = (j.log||[]).map(l=>`<div><span class="t">${l.t}</span>${esc(l.msg)}</div>`).join('');
    $('#log').scrollTop = $('#log').scrollHeight;
    $('#statusTag').textContent = {queued:'排队中',running:'进行中',done:'已完成',error:'失败'}[j.status]||j.status;
    if(j.status==='done'){clearInterval(TIMER);$('#go').disabled=false;await loadResult();}
    if(j.status==='error'){clearInterval(TIMER);$('#go').disabled=false;$('#statusTag').textContent='失败：'+(j.error||'');}
  }, 2000);
}
async function loadResult(){
  RESULT = await jget('/api/jobs/'+JOB+'/result');
  $('#out').style.display='';
  renderTabs(); renderPane();
  $('#out').scrollIntoView({behavior:'smooth'});
}
function download(fmt){ if(JOB) window.open(apiUrl(`/api/jobs/${JOB}/export/${fmt}`, true), '_blank'); }

function renderTabs(){
  const tabs = [['script','剧本'],['chars','人物画像'],['shots','分镜表'],['transcript','原文转录']];
  $('#tabs').innerHTML = tabs.map(([k,v])=>`<button class="${TAB===k?'on':''}" onclick="TAB='${k}';renderTabs();renderPane()">${v}</button>`).join('');
}
function renderPane(){
  if(!RESULT) return;
  const r = RESULT;
  if(TAB==='script'){
    const sc = r.script||{};
    $('#pane').innerHTML = `<div class="card">
      <h2>${esc(sc.title||r.source.title)}<em>改写剧本</em></h2>
      <div class="kv">
        <div><span>故事线</span><span>${esc(sc.logline)}</span></div>
        <div><span>影像风格</span><span>${esc(sc.style)}</span></div>
        <div><span>来源</span><span>${esc(r.source.platform)} / ${esc(r.source.uploader)}｜原片 ${esc(r.source.duration)}s</span></div>
        <div><span>分镜合计</span><span>${esc(r.storyboard_total_seconds)} 秒（目标 ${esc(r.target_seconds)} 秒）｜共 ${(r.shots||[]).length} 个镜头</span></div>
        <div><span>生成模型</span><span>${esc(r.llm.mode)} / ${esc(r.llm.model)}</span></div>
      </div>
      <div class="row" style="margin:12px 0"><button class="mini" onclick='copyPane()'>复制这一屏</button></div>
      ${(sc.scenes||[]).map(s=>`<div class="box" style="border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:#fdfcf9">
        <h3 style="margin:0 0 6px;font-size:15px">第 ${esc(s.no)} 场 · ${esc(s.heading)}<span class="badge">${esc(s.duration)}s</span></h3>
        <p style="margin:4px 0;font-size:13.5px;color:var(--ink2)">${esc(s.summary)}</p>
        <div class="mono">${esc(s.voiceover)}</div></div>`).join('')}
    </div>`;
  }
  if(TAB==='chars'){
    $('#pane').innerHTML = `<div class="card"><h2>人物画像<em>${(r.characters||[]).length} 个角色</em></h2>
      <p class="hint">anchor_cn / anchor_en 是锚定提示词：同一角色每次生成都带上它，才能不跑脸。</p>
      <div class="char">${(r.characters||[]).map(c=>`<div class="box">
        <h3>${esc(c.name)}<span class="badge">${esc(c.role)}</span></h3>
        <div class="kv">
          <div><span>年龄</span><span>${esc(c.age)}</span></div>
          <div><span>性别</span><span>${esc(c.gender)}</span></div>
          <div><span>体型</span><span>${esc(c.body)}</span></div>
          <div><span>面部发型</span><span>${esc(c.face)}</span></div>
          <div><span>穿戴</span><span>${esc(c.outfit)}</span></div>
          <div><span>配饰道具</span><span>${esc(c.accessories)}</span></div>
          <div><span>气质</span><span>${esc(c.vibe)}</span></div>
        </div>
        <div class="row" style="margin-top:8px"><button class="mini" onclick='copy(${JSON.stringify(JSON.stringify(c.anchor_cn||''))},"中文锚定已复制")'>复制中文锚定</button>
        <button class="mini" onclick='copy(${JSON.stringify(JSON.stringify(c.anchor_en||''))},"英文锚定已复制")'>复制英文锚定</button></div>
        <div class="mono" style="margin-top:8px">${esc(c.anchor_cn)}</div>
      </div>`).join('')}</div></div>`;
  }
  if(TAB==='shots'){
    $('#pane').innerHTML = `<div class="card"><h2>分镜表<em>${(r.shots||[]).length} 镜头 / ${esc(r.storyboard_total_seconds)}s</em></h2>
      <div class="scroll"><table><thead><tr><th>#</th><th>时长</th><th>景别</th><th>运镜</th><th>画面</th><th>提示词</th><th>字幕</th><th>音效</th><th></th></tr></thead><tbody>
      ${(r.shots||[]).map(s=>`<tr>
        <td>${esc(s.no)}</td><td><span class="pill">${esc(s.duration)}s</span></td>
        <td>${esc(s.shot_type)}</td><td>${esc(s.camera)}</td><td>${esc(s.visual)}</td>
        <td><div class="mono">${esc(s.prompt_cn)}</div><div class="mono" style="margin-top:6px;color:var(--ink3)">${esc(s.negative)}</div></td>
        <td>${esc(s.subtitle)}</td><td>${esc(s.sfx)}</td>
        <td><button class="mini" onclick='copy(${JSON.stringify(JSON.stringify(s.prompt_cn||''))},"镜头 ${esc(s.no)} 中文提示词已复制")'>中文</button>
            <button class="mini" style="margin-top:4px" onclick='copy(${JSON.stringify(JSON.stringify(s.prompt_en||''))},"镜头 ${esc(s.no)} 英文提示词已复制")'>EN</button></td>
      </tr>`).join('')}
      </tbody></table></div></div>`;
  }
  if(TAB==='transcript'){
    $('#pane').innerHTML = `<div class="card"><h2>原视频转录<em>${esc(r.transcript.language)} · ${(r.transcript.text||'').length} 字</em></h2>
      <div class="row" style="margin-bottom:8px"><button class="mini" onclick='copy(${JSON.stringify(JSON.stringify(r.transcript.text||''))},"全文已复制")'>复制全文</button></div>
      <div class="mono" style="max-height:60vh;overflow:auto">${esc(r.transcript.text)}</div></div>`;
  }
}
function copyPane(){ if(TAB==='script') copy(JSON.stringify(RESULT.script,null,2),'剧本 JSON 已复制'); }

$('#fillDemo').onclick = () => { $('#url').value='https://www.douyin.com/video/7412345678901234567'; toast('示例链接只是格式示范，请换成真链接'); };

initCfg(); health(); recipes();
</script>
</body>
</html>
